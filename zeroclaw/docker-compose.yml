version: "3.8"
services:

  zeroclaw:
    image: ghcr.io/zeroclaw-labs/zeroclaw:latest
    environment:
      - PROVIDER=ollama
      # Adjust URL based on host OS:
      # Linux: http://ollama:11434/v1
      # macOS/Windows: http://host.docker.internal:11434/v1
      - ZEROCLAW_PROVIDER_URL=http://192.168.50.18:11434/v1
      - ZEROCLAW_ALLOW_PUBLIC_BIND=true
    volumes:
      - zeroclaw-data:/zeroclaw-data
    ports:
      - "42617:42617"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 32M
    healthcheck:
      test: [ "CMD", "zeroclaw", "status", "--format=exit-code" ]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  zeroclaw-data:
