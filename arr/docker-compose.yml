  #     - 'wud.watch=true'
  #     - "com.centurylinklabs.watchtower.enable=true"

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ${OPT_DOCKER}/jellyseerr:/app/config
      - ${NFS_SHARE}:/data
    restart: unless-stopped
    labels:
      - "wud.watch=true"
      - "com.centurylinklabs.watchtower.enable=true"

