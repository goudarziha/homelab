version: "3"
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 9696:9696
    volumes:
      - ${OPT_DOCKER}/prowlarr:/config
      - ${NFS_SHARE}:/data
    restart: unless-stopped
    labels:
      - "wud.watch=true"
      - "com.centurylinklabs.watchtower.enable=true"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 7878:7878
    volumes:
      - ${OPT_DOCKER}/radarr:/config
      - ${NFS_SHARE}:/data
    restart: unless-stopped
    labels:
      - "wud.watch=true"
      - "com.centurylinklabs.watchtower.enable=true"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8989:8989
    volumes:
      - ${OPT_DOCKER}/sonarr:/config
      - ${NFS_SHARE}:/data
    restart: unless-stopped
    labels:
      - "wud.watch=true"
      - "com.centurylinklabs.watchtower.enable=true"

  # readarr:
